<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA9A6E"/>
      <stop offset="55%" stop-color="#DA7756"/>
      <stop offset="100%" stop-color="#B85B3C"/>
    </linearGradient>
    <linearGradient id="hairGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E4A36"/>
      <stop offset="100%" stop-color="#432B20"/>
    </linearGradient>
    <linearGradient id="hairGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A5540"/>
      <stop offset="100%" stop-color="#4E3123"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE7D1"/>
      <stop offset="100%" stop-color="#FBD5B8"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF5"/>
      <stop offset="100%" stop-color="#F1E6D8"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B5744A"/>
      <stop offset="100%" stop-color="#7C4A2C"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E9"/>
      <stop offset="100%" stop-color="#F1E4D3"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3D2416" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS 图标规范：可见内容不铺满 1024 画布，四周要留白边距（约 1024 的 80%），
       不然放进 Dock 跟其他应用图标比会显得偏大一圈。整体缩小并居中。 -->
  <g transform="translate(512,512) scale(0.82) translate(-512,-512)">

  <!-- 背景 squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad)"/>
  <ellipse cx="330" cy="230" rx="430" ry="300" fill="#FFFFFF" opacity="0.10"/>

  <!-- 肩膀/衣服（盖住发尾根部，避免脖子处露出一截生硬的头发） -->
  <path d="M512 700 C 660 700 812 790 852 1024 L 172 1024 C 212 790 364 700 512 700 Z" fill="url(#topGrad)"/>

  <!-- 后发（长发轮廓，垂到肩下） -->
  <path d="M266 400 C 222 540 214 700 254 936 C 296 982 340 992 384 980 C 344 820 328 660 350 452 Z" fill="url(#hairGradFront)"/>
  <path d="M758 400 C 802 540 810 700 770 936 C 728 982 684 992 640 980 C 680 820 696 660 674 452 Z" fill="url(#hairGradFront)"/>
  <ellipse cx="512" cy="470" rx="298" ry="270" fill="url(#hairGradBack)"/>

  <!-- 脸 -->
  <circle cx="512" cy="494" r="226" fill="url(#skinGrad)"/>

  <!-- 刘海 -->
  <path d="M282 486 C 282 350 380 262 512 262 C 644 262 742 350 742 486 C 742 404 656 344 512 344 C 368 344 282 404 282 486 Z" fill="url(#hairGradFront)"/>

  <!-- 腮红 -->
  <ellipse cx="390" cy="560" rx="29" ry="15" fill="#F2A98C" opacity="0.55"/>
  <ellipse cx="634" cy="560" rx="29" ry="15" fill="#F2A98C" opacity="0.55"/>

  <!-- 眉毛 -->
  <path d="M388 470 C 404 456 448 456 464 470" stroke="#4E3123" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M560 470 C 576 456 620 456 636 470" stroke="#4E3123" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="427" cy="504" rx="32" ry="38" fill="#FFFFFF"/>
    <circle cx="427" cy="508" r="24" fill="url(#irisGrad)"/>
    <circle cx="427" cy="508" r="11" fill="#211208"/>
    <circle cx="418" cy="496" r="8" fill="#FFFFFF"/>
    <circle cx="438" cy="518" r="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M395 484 C 405 476 450 476 462 486" stroke="#2B2118" stroke-width="9" fill="none" stroke-linecap="round"/>

    <ellipse cx="597" cy="504" rx="32" ry="38" fill="#FFFFFF"/>
    <circle cx="597" cy="508" r="24" fill="url(#irisGrad)"/>
    <circle cx="597" cy="508" r="11" fill="#211208"/>
    <circle cx="588" cy="496" r="8" fill="#FFFFFF"/>
    <circle cx="608" cy="518" r="4" fill="#FFFFFF" opacity="0.8"/>
    <path d="M562 486 C 574 476 619 476 629 484" stroke="#2B2118" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 嘴巴 -->
  <path d="M494 588 Q512 606 530 588" stroke="#B5563A" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 耳机 -->
  <g filter="url(#softShadow)">
    <path d="M296 424 C 296 244 728 244 728 424" fill="none" stroke="#F6ECDF" stroke-width="50" stroke-linecap="round"/>
    <ellipse cx="282" cy="486" rx="78" ry="108" fill="url(#cupGrad)"/>
    <ellipse cx="742" cy="486" rx="78" ry="108" fill="url(#cupGrad)"/>
  </g>
  <ellipse cx="282" cy="486" rx="46" ry="68" fill="none" stroke="#DA7756" stroke-width="10"/>
  <ellipse cx="742" cy="486" rx="46" ry="68" fill="none" stroke="#DA7756" stroke-width="10"/>
  <ellipse cx="256" cy="446" rx="18" ry="30" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="716" cy="446" rx="18" ry="30" fill="#FFFFFF" opacity="0.55"/>

  <!-- 蝴蝶结（画在最上层，确保不被耳机遮住） -->
  <g transform="translate(300,300) rotate(-18)">
    <path d="M0 0 L-56 -30 C-70 -20 -70 20 -56 30 Z" fill="#C2603F" stroke="#A8492E" stroke-width="4"/>
    <path d="M0 0 L56 -30 C70 -20 70 20 56 30 Z" fill="#DA7756" stroke="#A8492E" stroke-width="4"/>
    <circle cx="0" cy="0" r="15" fill="#B5563A"/>
  </g>

  </g>
</svg>
